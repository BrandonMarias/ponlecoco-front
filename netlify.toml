[[redirects]]
  from = "/api/*"
  to = "http://143.244.178.3:3000/api/:splat"
  status = 200
  force = true

# Headers CORS simples para JWT (no necesitamos cookies)
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS, HEAD, PATCH"
    Access-Control-Allow-Headers = "Accept, Authorization, Content-Type, Origin, X-Requested-With"
    Access-Control-Max-Age = "86400"

# Headers para la aplicación principal
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
