@if (loadingData()) {
  <div class="content-page h-dvh flex items-center justify-center text-gray-600 dark:text-gray-300">
    <p>Cargando datos de la trivia...</p>
  </div>
} @else {
  <app-quiz-editor-shell
    [titleControl]="titleControl"
    titlePlaceholder="Ej: Cultura General"
    logo="/media/img/piensarapido.png"
    instructionsKey="quick-thinking"
    [instructions]="instructions"
    [aiDisabled]="loading() || aiUsage.exhausted()"
    [saving]="loading()"
    [invalid]="quickThinkingForm.invalid"
    [saveLabel]="isEditMode() ? 'Guardar cambios' : 'Guardar trivia'"
    [incompleteCount]="incompleteTotal()"
    [current]="state.selected()"
    [scrollKey]="state.selected()"
    [total]="questions.length"
    (back)="cancel()"
    (save)="onSaveClick()"
    (ai)="generateQuestionsWithAI()"
    (review)="state.openReview()"
    (prev)="state.prev()"
    (next)="state.next()"
    (jumpIncomplete)="jumpToFirstIncomplete()"
  >
    <app-quiz-navigator
      navigator
      [items]="navItems()"
      [selected]="state.selected()"
      [canAdd]="questions.length < MAX_QUESTIONS"
      [counter]="questions.length + '/' + MAX_QUESTIONS"
      (select)="state.select($event)"
      (add)="addQuestion()"
    />

    @for (q of currentList(); track $index) {
      <div [formGroup]="q" class="max-w-2xl mx-auto w-full p-3 md:p-5 space-y-3">
        <app-quiz-question-toolbar
          [label]="'Pregunta ' + (state.selected() + 1)"
          [status]="questionStatus(q)"
          [index]="state.selected()"
          [total]="questions.length"
          [canDuplicate]="questions.length < MAX_QUESTIONS"
          [canDelete]="questions.length > 1"
          (duplicate)="duplicateQuestion(state.selected())"
          (moveUp)="moveQuestion(state.selected(), -1)"
          (moveDown)="moveQuestion(state.selected(), 1)"
          (remove)="removeQuestion(state.selected())"
        />

        <!-- Question + optional image -->
        <div class="flex items-start gap-3">
          <textarea
            formControlName="question"
            rows="4"
            aria-label="Pregunta"
            placeholder="Escribe la pregunta..."
            class="flex-1 min-w-0 px-3 py-3 text-lg sm:text-xl font-semibold text-center resize-none bg-white border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-800 dark:border-gray-600 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500"
            [class.ring-2]="q.get('question')?.invalid && q.get('question')?.touched"
            [class.ring-red-500]="q.get('question')?.invalid && q.get('question')?.touched"
          ></textarea>
          <app-image-upload
            variant="tile"
            [previewUrl]="getImagePreview(state.selected())"
            [isCompressing]="isCompressing(q)"
            [inputId]="'image-' + state.selected()"
            (fileSelected)="onImageSelected($event, state.selected())"
            (imageRemoved)="removeImage(state.selected())"
          />
        </div>

        <!-- Options: tap the check to mark the correct one -->
        <div formArrayName="options" role="radiogroup" aria-label="Respuesta correcta" class="grid grid-cols-2 gap-2 sm:gap-3">
          @for (opt of optionsOf(q); track $index; let o = $index) {
            <div
              class="relative flex flex-col gap-1 p-2 min-h-32 rounded-xl text-white shadow-sm transition-shadow ring-offset-2 dark:ring-offset-gray-900 focus-within:ring-4 focus-within:ring-indigo-400"
              [class]="optionTiles[o].tile"
              [class.ring-4]="q.get('correctAnswerIndex')?.value === o"
              [class.ring-gray-900]="q.get('correctAnswerIndex')?.value === o"
              [class.dark:ring-white]="q.get('correctAnswerIndex')?.value === o"
            >
              <div class="flex items-center justify-between">
                <app-quiz-icon [name]="optionTiles[o].shape" class="w-6 h-6 ml-1 text-white/90" />
                <button
                  type="button"
                  role="radio"
                  [attr.aria-checked]="q.get('correctAnswerIndex')?.value === o"
                  [attr.aria-label]="'Opción ' + (o + 1) + ' (' + optionTiles[o].color + ')' + (q.get('correctAnswerIndex')?.value === o ? ': correcta' : ': marcar como correcta')"
                  (click)="setCorrectAnswer(q, o)"
                  class="w-10 h-10 shrink-0 inline-flex items-center justify-center rounded-full border-2 transition-colors touch-manipulation focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
                  [class]="
                    q.get('correctAnswerIndex')?.value === o
                      ? 'bg-white border-white text-green-600'
                      : 'bg-white/10 border-white/80 text-transparent hover:bg-white/25'
                  "
                >
                  <app-quiz-icon name="check" class="w-6 h-6" />
                </button>
              </div>
              <textarea
                [formControlName]="o"
                rows="3"
                [attr.aria-label]="'Opción ' + (o + 1)"
                placeholder="Opción {{ o + 1 }}"
                class="flex-1 w-full px-1 bg-transparent resize-none text-base font-semibold text-white placeholder-white/70 focus:outline-none"
              ></textarea>
              @if (opt.invalid && opt.touched) {
                <app-quiz-icon name="alert" class="absolute bottom-2 right-2 w-5 h-5" />
              }
            </div>
          }
        </div>
      </div>
    }
  </app-quiz-editor-shell>

  @if (state.reviewOpen()) {
    <app-quiz-review-overlay
      [cards]="reviewCards()"
      [incomplete]="incompleteTotal()"
      (select)="state.pick($any($event))"
      (closed)="state.closeReview()"
    />
  }
}

<app-quiz-toast [show]="showToast()" [message]="toastMessage()" [type]="toastType()" />
