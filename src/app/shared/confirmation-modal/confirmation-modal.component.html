@if (modalService.isOpen()) {
  <div class="fixed inset-0 bg-gray-900 bg-opacity-75 backdrop-blur-sm z-40 flex items-center justify-center p-4" (click)="onCancel()">
    <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md z-50" (click)="$event.stopPropagation()">
      @if (modalService.modalData(); as data) {
        <h3 class="text-xl font-semibold text-gray-900 mb-2">{{ data.title }}</h3>
        <p class="text-gray-600 mb-6">{{ data.message }}</p>
      }
      <div class="flex justify-end space-x-4">
        <button (click)="onCancel()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300">
          Cancelar
        </button>
        <button (click)="onConfirm()" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">
          Confirmar
        </button>
      </div>
    </div>
  </div>
}
