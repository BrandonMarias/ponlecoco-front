@if (loadingData()) {
  <div class="content-page h-dvh p-4 flex flex-col gap-4 animate-pulse" aria-busy="true" aria-label="Cargando datos de la ruleta">
    <div class="h-12 rounded-xl bg-gray-200 dark:bg-gray-700"></div>
    <div class="flex gap-2">
      @for (n of [1, 2, 3, 4, 5, 6]; track n) {
        <div class="h-12 w-12 shrink-0 rounded-xl bg-gray-200 dark:bg-gray-700"></div>
      }
    </div>
    <div class="flex-1 rounded-2xl bg-gray-200 dark:bg-gray-700"></div>
  </div>
} @else {
  <app-quiz-editor-shell
    [titleControl]="titleControl"
    titlePlaceholder="Ej: Ruleta del Conocimiento"
    [instructions]="instructions"
    [aiDisabled]="loading() || aiUsage.exhausted()"
    [saving]="loading()"
    [invalid]="rouletteForm.invalid"
    [saveLabel]="isEditMode() ? 'Guardar cambios' : 'Guardar ruleta'"
    [incompleteCount]="incompleteTotal()"
    [error]="error()"
    [current]="state.selected()"
    [scrollKey]="state.selected()"
    [total]="questions.length"
    (back)="cancel()"
    (save)="onSaveClick()"
    (ai)="generateRouletteWithAI()"
    (review)="state.openReview()"
    (prev)="state.prev()"
    (next)="state.next()"
    (jumpIncomplete)="jumpToFirstIncomplete()"
  >
    <app-quiz-navigator
      navigator
      [items]="navItems()"
      [selected]="state.selected()"
      [showAdd]="false"
      (select)="state.select($event)"
    />

    @for (q of currentList(); track $index) {
      <div [formGroup]="q" class="max-w-2xl mx-auto w-full p-3 md:p-5 space-y-3">
        <!-- 12 fixed slots: no add / duplicate / move / delete -->
        <app-quiz-question-toolbar
          [label]="'Pregunta ' + (state.selected() + 1)"
          [status]="questionStatus(q)"
          [badge]="q.get('value')?.value + ' pts'"
          [badgeClass]="navItems()[state.selected()]?.badgeClass"
          [allowDuplicate]="false"
          [allowMove]="false"
          [allowDelete]="false"
        />

        <!-- Question + optional image -->
        <div class="flex items-start gap-3">
          <textarea
            formControlName="question"
            rows="4"
            aria-label="Pregunta"
            placeholder="Escribe la pregunta..."
            class="flex-1 min-w-0 px-3 py-3 text-lg sm:text-xl font-semibold text-center resize-none bg-white border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-800 dark:border-gray-600 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500"
            [class.ring-2]="q.get('question')?.invalid && q.get('question')?.touched"
            [class.ring-red-500]="q.get('question')?.invalid && q.get('question')?.touched"
          ></textarea>
          <app-image-upload
            variant="tile"
            [previewUrl]="getPreviewUrl(state.selected())"
            [isCompressing]="isImageCompressing(state.selected())"
            [inputId]="'img-' + state.selected()"
            (fileSelected)="onFileSelected($event, state.selected())"
            (imageRemoved)="removeImage(state.selected())"
          />
        </div>

        <!-- Answer -->
        <div class="rounded-xl border-2 border-green-500 bg-green-50 dark:bg-green-900/20 p-2">
          <textarea
            formControlName="answer"
            rows="3"
            aria-label="Respuesta"
            placeholder="Respuesta"
            class="w-full px-2 py-1 text-base sm:text-lg font-semibold text-center resize-none bg-transparent text-green-900 dark:text-green-100 placeholder-green-700/50 dark:placeholder-green-300/50 focus:outline-none"
            [class.ring-2]="q.get('answer')?.invalid && q.get('answer')?.touched"
            [class.ring-red-500]="q.get('answer')?.invalid && q.get('answer')?.touched"
          ></textarea>
        </div>
      </div>
    }
  </app-quiz-editor-shell>

  @if (state.reviewOpen()) {
    <app-quiz-review-overlay
      [cards]="reviewCards()"
      [incomplete]="incompleteTotal()"
      (select)="state.pick($any($event))"
      (closed)="state.closeReview()"
    />
  }
}

<app-quiz-toast [show]="showToast()" [message]="toastMessage()" [type]="toastType()" />
