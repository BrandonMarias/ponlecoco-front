<div class="fixed inset-0 bg-gray-900 bg-opacity-75 backdrop-blur-md z-40 flex items-center justify-center p-4">
  <div class="bg-blue-800 border-4 border-blue-400 text-white rounded-lg shadow-xl p-8 w-full max-w-3xl z-50 text-center relative">

    <!-- Time's Up Banner -->
    @if (showTimeUpBanner()) {
      <div class="absolute inset-x-0 top-1/3 bg-red-600/90 text-white text-5xl font-bold p-8 z-10">
        ¡TIEMPO!
      </div>
    }

    <div class="flex items-center justify-between gap-4 mb-6">
      <!-- Points Display -->
      <div class="flex items-center justify-center gap-4">
        <span class="text-4xl font-bold text-yellow-300">X {{ question.value }}</span>
        @if (question.doublePoints) {
          <img src="/media/img/puntosdobles.png" alt="Puntos Dobles" class="h-16 double-points-animation">
        }
      </div>
      <!-- Timer -->
      <div class="text-5xl font-mono font-bold text-yellow-300">
        {{ formattedTime() }}
      </div>
    </div>

    <p class="text-3xl font-bold mb-8">{{ question.question }}</p>

    @if (showAnswer()) {
      <div class="bg-gray-900 p-4 rounded-md">
        <p class="text-4xl font-bold text-yellow-400">{{ question.answer }}</p>
      </div>
      <div class="flex justify-center space-x-4 mt-8">
        <button (click)="onIncorrect()" class="px-6 py-3 bg-red-600 rounded-md font-semibold text-lg cursor-pointer">
          Incorrecto
        </button>
        <button (click)="onCorrect()" class="px-6 py-3 bg-green-600 rounded-md font-semibold text-lg cursor-pointer">
          Correcto
        </button>
      </div>
    } @else {
      <button (click)="revealAnswer()" class="mt-8 px-6 py-3 bg-green-600 rounded-md font-semibold text-lg cursor-pointer">
        Revelar Respuesta
      </button>
    }
  </div>
</div>
